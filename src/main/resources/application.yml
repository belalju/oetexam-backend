spring:
  application:
    name: oetexam
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    # Local dev: values are read from a .env file in the working directory
    # (copy .env.prod.example to .env). Real env vars still take precedence.
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 75MB
      max-request-size: 75MB
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  tomcat:
    max-http-form-post-size: 75MB

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-must-be-long}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
  upload:
    audio-dir: ${AUDIO_UPLOAD_DIR:./uploads/audio/}
  google:
    client-id: ${GOOGLE_CLIENT_ID:480399955475-en9hgiaa5cf6bp6oggb86m0ffhnobpcr.apps.googleusercontent.com}
  mail:
    from: ${MAIL_FROM:no-reply@oetpractice.com}
    verification-token-expiration-hours: 24
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  backend:
    base-url: ${BACKEND_BASE_URL:http://localhost:8080}
  payment:
    sslcommerz:
      # Sandbox: https://sandbox.sslcommerz.com | Live: https://securepay.sslcommerz.com
      base-url: ${SSLCOMMERZ_BASE_URL:https://sandbox.sslcommerz.com}
      store-id: ${SSLCOMMERZ_STORE_ID:deenc6abe156d48922}
      store-password: ${SSLCOMMERZ_STORE_PASSWORD:deenc6abe156d48922@ssl}
      # SSLCommerz form-POSTs the customer's browser here; the backend then redirects to result-page-url.
      success-url: ${SSLCOMMERZ_SUCCESS_URL:${app.backend.base-url}/api/payments/callback/success}
      fail-url: ${SSLCOMMERZ_FAIL_URL:${app.backend.base-url}/api/payments/callback/fail}
      cancel-url: ${SSLCOMMERZ_CANCEL_URL:${app.backend.base-url}/api/payments/callback/cancel}
      result-page-url: ${SSLCOMMERZ_RESULT_PAGE_URL:${app.frontend.base-url}/payment}
      ipn-url: ${SSLCOMMERZ_IPN_URL:https://sandbox-gw.sslcommerz.com/ipn}
      connect-timeout: 10s
      read-timeout: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

